<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Supreme Mobiles Christmas Offer{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark brand-nav shadow-sm">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="navbar-brand d-flex align-items-center fw-bold text-white text-decoration-none" href="/">
      <img src="{{ url_for('static', filename='supreme_logo.avif') }}" alt="Supreme Mobiles" height="40" class="me-2 rounded bg-white p-1">
      <span>SUPREME MOBILES</span>
    </a>
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin_login') }}">Admin</a>
  </div>
</nav>
<main class="container py-4">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}
<div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>
{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
<footer class="text-center py-4 small text-secondary">© Supreme Mobiles · Christmas Gift Registration</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
